version: 1
project:
  name: directus
  description: Directus monorepo contributor readiness slice
metadata:
  ota:
    minimum_version: "1.6.20"
execution:
  default_context: host
  contexts:
    host:
      backend: native
    app:
      backend: container
      lifecycle: ephemeral
      container:
        image: node:22-bookworm
        engines:
          - docker
          - podman
      attachments:
        isolated_paths:
          - node_modules
          - .pnpm-store
toolchains:
  node:
    provider: corepack
    version: "22"
    package_managers:
      pnpm: "10.27.0"
tasks:
  setup:
    context: host
    description: Install pnpm workspace dependencies
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: pnpm
        mode: install
        frozen_lockfile: true
    execution:
      default_mode: native
      modes:
        container:
          context: app
    effects:
      writes:
        - node_modules
        - .pnpm-store
      network: true
      network_kind: dependency_hydration
    requirements:
      toolchains:
        - node
    notes: Uses the lockfile-strict pnpm hydration lane so agent and CI verification do not rely on
      a mutable install path.
  build:
    context: host
    description: Build the Directus workspace packages
    run: corepack pnpm build
    depends_on:
      - setup
    execution:
      default_mode: native
      modes:
        container:
          context: app
    requirements:
      toolchains:
        - node
    notes: This is heavier than the default agent path because it recursively builds the monorepo.
  lint:
    context: host
    description: Run the root ESLint surface
    run: corepack pnpm lint
    execution:
      default_mode: native
      modes:
        container:
          context: app
    requirements:
      toolchains:
        - node
      checks:
        - workspace-dependencies-installed
    effects:
      writes:
        - .eslintcache
    safe_for_agent: true
    notes: CI narrows this to changed files; this contract keeps the repo-level lint command as the portable default.
  lint:style:
    context: host
    description: Run the root Stylelint surface
    run: corepack pnpm lint:style
    depends_on:
      - setup
    execution:
      default_mode: native
      modes:
        container:
          context: app
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - .stylelintcache
    notes: CI narrows this to changed files; this task runs the declared repo script. The current
      upstream baseline can fail here, so treat it as a truthful repo surface rather than an assumed
      green smoke lane.
  format:check:
    context: host
    description: Check Prettier formatting without modifying files
    run: corepack pnpm format
    depends_on:
      - setup
    execution:
      default_mode: native
      modes:
        container:
          context: app
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - node_modules/.cache
    internal: true
    notes: The root `format` script is already a check command, not a writer.
  test:
    context: host
    description: Run the root recursive unit test surface
    run: corepack pnpm test
    depends_on:
      - setup
    execution:
      default_mode: native
      modes:
        container:
          context: app
    requirements:
      toolchains:
        - node
    notes: Excludes the blackbox workspace the same way the root script does. This is the truthful
      recursive unit-test surface, but the current upstream baseline can fail here, so do not
      present it as a guaranteed quick green check.
  test:coverage:
    context: host
    description: Run recursive unit tests with coverage
    run: corepack pnpm test:coverage
    depends_on:
      - setup
    execution:
      default_mode: native
      modes:
        container:
          context: app
    requirements:
      toolchains:
        - node
    notes: Heavier CI coverage path; not agent-safe by default because it writes coverage output.
  app:typecheck:
    context: host
    description: Run Vue type checking for the app workspace
    run: corepack pnpm --filter @directus/app typecheck
    depends_on:
      - setup
    execution:
      default_mode: native
      modes:
        container:
          context: app
    requirements:
      toolchains:
        - node
    safe_for_agent: false
    internal: true
    notes: Useful for app-facing changes that need a targeted typecheck.
  api:test:
    context: host
    description: Run API package tests
    run: corepack pnpm --filter @directus/api test
    depends_on:
      - setup
    execution:
      default_mode: native
      modes:
        container:
          context: app
    requirements:
      toolchains:
        - node
    safe_for_agent: false
    internal: true
    notes: Useful when API-only changes do not need the whole recursive test surface.
  test:blackbox:
    context: host
    description: Run Directus blackbox tests through the repository script
    run: corepack pnpm test:blackbox
    depends_on:
      - setup
    effects:
      writes:
        - dist
      external_state:
        - docker
    requirements:
      toolchains:
        - node
      tools:
        docker: "*"
    notes: Heavy service-backed path; run only when blackbox coverage is intentionally required.
  verify:
    description: Run the lean contributor verification path
    aggregate:
      tasks:
        - lint
    safe_for_agent: true
    notes: Use this before proposing normal contributor changes; it stays lean on purpose because
      the broader root `lint:style` and `test` surfaces are real but not currently reliable as fast
      green smoke checks. Run `format:check`, `lint:style`, `app:typecheck`, and `api:test`
      explicitly when broader validation is required.
checks:
  - name: workspace-dependencies-installed
    kind: file
    severity: error
    path: node_modules/.modules.yaml
    expect: file
    timeout: 10000
workflows:
  default: checks
  checks:
    intent: ci_validation
    description: Lean PR validation path for normal contributor changes
    setup:
      task: setup
    run:
      task: verify
    notes: Uses check-style tasks and targeted tests instead of the full blackbox matrix.
  unit:
    intent: ci_validation
    description: Full recursive unit test path
    setup:
      task: setup
    run:
      task: test
    notes: Mirrors the root `pnpm test` script.
  build:
    intent: ci_validation
    description: Full workspace build path
    setup:
      task: setup
    run:
      task: build
    notes: Use this when workspace package boundaries or build outputs may be affected.
  blackbox:
    intent: packaged_runtime
    description: Heavy Docker-backed blackbox test path
    setup:
      task: setup
    run:
      task: test:blackbox
    notes: This is intentionally outside the agent-safe default because it mutates Docker state.
agent:
  posture: readiness_strict
  default_task: verify
  safe_tasks:
    - lint
    - verify
  verify_after_changes:
    - verify
  writable_paths:
    - api
    - app
    - .pnpm-store
    - directus
    - node_modules
    - packages
    - sdk
    - tests
    - .eslintcache
    - .stylelintcache
  protected_paths:
    - .env
    - .github/workflows
    - .npmrc
    - docker-compose.yml
    - Dockerfile
    - ota.yaml
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
  bootstrap:
    ota:
      note: Install ota only when missing so contributors and agents can use the readiness workflows declared here.
      sh: curl -fsSL https://dist.ota.run/install.sh | OTA_VERSION=v1.6.21 sh
      powershell: $env:OTA_VERSION='v1.6.21'; irm https://dist.ota.run/install.ps1 | iex
  notes: |
    This contract intentionally scopes Directus to monorepo contributor readiness:
    dependency install, lint/style/format checks, targeted app/API tests, full unit tests,
    build, and the heavy blackbox entrypoint.
    Use `ota tasks --safe --use` to see the commands agents are allowed to run.
    Use `ota up --workflow checks` on a fresh checkout so Ota runs setup before verification.
    Use `ota up --workflow checks --container` to run the same check path through the declared
    Node container context; native remains the default.
    Use `ota run verify` after dependencies are already installed.
    Use `ota up --workflow unit` or `ota up --workflow build` when broader repo proof is needed.
    Use `ota up --workflow blackbox` only when Docker-backed blackbox testing is intentional.
    Do not edit env files, lockfiles, workspace topology, Docker files, CI workflows, or this
    contract unless the maintainer explicitly asks for contract or infrastructure authoring.
